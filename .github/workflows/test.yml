name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    name: Ubuntu (GitHub runner)
    runs-on: ubuntu-latest
    env:
      DOTFILES_DIR: ${{ github.workspace }}
      SKIP_CLONE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ansible
        run: pip3 install --user ansible && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Galaxy requirements
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            --extra-vars headless=true \
            -e ansible_python_interpreter=/usr/bin/python3

  arch:
    name: Arch Linux (Docker)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      DOTFILES_DIR: ${{ github.workspace }}
      SKIP_CLONE: "true"
    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm python python-pip git curl sudo ca-certificates

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ansible
        run: pip install --break-system-packages ansible

      - name: Install Galaxy requirements
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            --extra-vars headless=true \
            -e ansible_python_interpreter=/usr/bin/python3

  windows:
    name: Windows (GitHub runner)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Ensure winget
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PSResource -Name Microsoft.WinGet.Client -Repository PSGallery -TrustRepository -Quiet
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version

      - name: Run setup
        run: ./windows/setup.ps1 -Headless

      - name: Verify
        run: ./windows/verify.ps1

  macos:
    name: macOS (GitHub runner)
    runs-on: macos-latest
    env:
      DOTFILES_DIR: ${{ github.workspace }}
      SKIP_CLONE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ansible
        run: brew install ansible

      - name: Install Galaxy requirements
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup.yml \
            --extra-vars headless=true \
            -e ansible_python_interpreter=/usr/bin/python3
