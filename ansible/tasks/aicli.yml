---
# ── macOS ─────────────────────────────────────────────────────────────────────
- name: Install claude-code cask (macOS)
  community.general.homebrew_cask:
    name: claude-code
    state: present
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  when: ansible_facts['os_family'] == 'Darwin'

# codex and opencode use their official install scripts on every OS (below).
# Homebrew refuses formulas from untrusted third-party taps, and the old
# sst/tap/opencode tap is no longer the one opencode documents.

# ── Linux ─────────────────────────────────────────────────────────────────────
- name: Check if claude is installed
  shell: |
    export PATH="{{ home_dir }}/.claude/local:{{ home_dir }}/.local/bin:$PATH"
    command -v claude
  register: claude_check
  failed_when: false
  changed_when: false
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] != 'Darwin'

- name: Install claude-code via official installer
  shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] != 'Darwin' and claude_check.rc != 0

- name: Check if codex is installed
  shell: |
    export PATH="{{ home_dir }}/.local/bin:{{ home_dir }}/.codex/bin:$PATH"
    command -v codex
  register: codex_check
  failed_when: false
  changed_when: false
  args:
    executable: /bin/bash

- name: Install codex via official installer (macOS + Linux)
  shell: curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
  args:
    executable: /bin/sh
  when: codex_check.rc != 0

- name: Check if opencode is installed
  shell: |
    export PATH="{{ home_dir }}/.local/bin:$PATH"
    command -v opencode
  register: opencode_check
  failed_when: false
  changed_when: false
  args:
    executable: /bin/bash

- name: Install opencode via official installer (macOS + Linux)
  shell: curl -fsSL https://opencode.ai/install | bash
  args:
    executable: /bin/bash
  when: opencode_check.rc != 0
