---
- name: Install Ghostty (macOS)
  community.general.homebrew_cask:
    name: ghostty
    state: present
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  when: ansible_facts['os_family'] == 'Darwin'

- name: Enable Ghostty COPR (Fedora/RHEL)
  community.general.copr:
    name: pgdev/ghostty
    state: enabled
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Ghostty (Fedora/RHEL)
  dnf:
    name: ghostty
    state: present
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Ghostty (Arch)
  community.general.pacman:
    name: ghostty
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Archlinux'
